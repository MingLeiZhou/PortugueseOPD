<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT60 · 电网与案例</title><link rel="icon" href="data:,">
<style>
:root{font-family:system-ui,sans-serif;color:#e4ebf0;background:#101923}*{box-sizing:border-box}body{margin:0}header{height:72px;display:flex;align-items:center;gap:24px;padding:16px 26px;border-bottom:1px solid #30404f}h1{font-size:23px;margin:0;color:#8be3d1}header span{color:#a4b4c1;font-size:14px}main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 72px)}aside{padding:20px;overflow:auto;background:#16222e;border-right:1px solid #30404f}label{display:block;font-size:13px;color:#aec0cc;margin:15px 0 7px}select,input,button{font:inherit;background:#213341;border:1px solid #41586a;color:#e4ebf0;border-radius:6px;padding:9px;width:100%}button{cursor:pointer}button:hover{background:#344e60}.row{display:flex;gap:8px}.row button{width:auto;flex:1}#volts{display:flex;flex-wrap:wrap;gap:9px}#volts label{margin:0;display:flex;align-items:center;gap:4px}#volts input{width:auto}#map{position:relative;overflow:hidden;background:#0d1822}canvas{width:100%;height:100%;display:block;touch-action:none}#legend{position:absolute;left:20px;bottom:22px;padding:10px 14px;background:#16222eea;border:1px solid #354957;border-radius:6px;font-size:13px;pointer-events:none}#hint{position:absolute;left:20px;top:16px;color:#afbfcc;font-size:12px;pointer-events:none}#stats{font-size:14px;line-height:1.9;border-top:1px solid #354957;margin-top:20px;padding-top:15px}#detail{font-size:12px;line-height:1.8;overflow-wrap:anywhere;margin-top:20px}#detail dt{color:#9fb3c4}#detail dd{margin:0 0 9px}#status{overflow-wrap:anywhere;color:#a7c6d6;font-size:12px;min-height:35px;margin-top:15px}.note{font-size:12px;color:#9aafbd;line-height:1.7}#time{font-variant-numeric:tabular-nums;font-size:13px;margin:10px 0}a{color:#8be3d1}#download{font-size:13px;display:block;margin-top:12px}@media(max-width:720px){main{grid-template-columns:230px 1fr}aside{padding:12px}header{gap:12px;padding:12px}header span{font-size:11px}}
</style></head><body>
<header><h1>PT60</h1><span>葡萄牙 60–400 kV · 电网与案例查看器</span><span id="version"></span></header>
<main><aside>
<label for="season">验证周</label><select id="season"><option value="SUMMER">夏季 · 2025-07-07—13</option><option value="WINTER">冬季 · 2026-01-19—25</option></select>
<label for="case">案例（UTC 区间起点）</label><select id="case"></select>
<input id="slider" aria-label="时点" type="range" min="0" max="167" value="0"><div class="row"><button id="prev">← 上一时点</button><button id="next">下一时点 →</button></div><div id="time"></div>
<label for="variant">负荷空间分配</label><select id="variant"><option value="AC_REVISED">PDIRT 权重 · 主方案</option><option value="UNIFORM_PDE">交付点均匀分配</option><option value="CAPACITY_PDE">变压器容量权重</option></select>
<label for="mode">显示指标</label><select id="mode"><option value="topology">拓扑与电压等级</option><option value="loading">线路负载率</option><option value="voltage">母线电压</option><option value="delta">线路负载差 · 当前方案 − 主方案</option></select>
<label>电压等级（kV）</label><div id="volts"></div>
<label for="search">搜索设施名称 / 母线 ID / 线路 ID</label><input id="search" placeholder="例如 LAMAS 或 LINE:000001"><div class="row" style="margin-top:8px"><button id="find">定位</button><button id="reset">全网</button></div>
<div id="status" role="status">正在读取冻结数据…</div><div id="stats"></div>
<a id="download" download="pt60-device-results.json">下载当前设备结果 JSON</a>
<p class="note">展示 rc2 归档或明确载入的本地计算结果。拖动平移，滚轮缩放，点击线路或母线查看来源。灰色表示该时点无有限计算值。底图仅含网络几何，未连接在线地图服务。</p><div id="detail"></div>
</aside><section id="map" aria-label="葡萄牙电网地图"><canvas id="canvas" aria-label="电网几何与计算结果"></canvas><div id="hint">拖动平移 · 滚轮缩放 · 点击设备查看数值与来源</div><div id="legend"></div></section></main>
<script>
const $=id=>document.getElementById(id), colors={60:'#62b8e5',130:'#c084fc',150:'#55d4a7',220:'#f4bf61',400:'#fa7e78'};
let topo,catalog,group=[],current,baseline,selected=null,visible=new Set([60,130,150,220,400]),request=0;
let scale=1,ox=0,oy=0,W=1,H=1,drag=null,moved=false,blobUrl;
const canvas=$('canvas'),ctx=canvas.getContext('2d');
for(const [v,color] of Object.entries(colors)){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=()=>{c.checked?visible.add(+v):visible.delete(+v);draw()};l.append(c,document.createTextNode(v));l.style.color=color;$('volts').append(l)}
async function get(url){const r=await fetch(url);if(!r.ok)throw Error(`${r.status} ${url}`);return r.json()}
function point(lon,lat){return [Number(lon)*.77*scale+ox,-Number(lat)*scale+oy]}
function fit(){const bs=topo.buses.filter(b=>Number.isFinite(+b.lon)&&Number.isFinite(+b.lat));const xs=bs.map(b=>+b.lon*.77),ys=bs.map(b=>-b.lat);const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);scale=Math.min((W-80)/(xmax-xmin),(H-80)/(ymax-ymin));ox=(W-scale*(xmin+xmax))/2;oy=(H-scale*(ymin+ymax))/2;draw()}
function resize(){const box=canvas.getBoundingClientRect();W=box.width;H=box.height;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(topo)fit()}
function valueColor(v,kind){if(v==null)return '#45515b';if(kind==='delta')return v>0.05?'#fb8b73':v<-.05?'#66bbed':'#718695';if(kind==='voltage')return v<.95?'#fb8b73':v>1.05?'#cba0ff':'#65d8b0';return v>100?'#ff736b':v>80?'#edbe62':'#5eacd1'}
function draw(){if(!topo)return;ctx.clearRect(0,0,W,H);const mode=$('mode').value;
for(const l of topo.lines){if(!visible.has(+l.voltage_kv))continue;let v=current?.line_loading[l.line_id];if(mode==='delta'){const b=baseline?.line_loading[l.line_id];v=v==null||b==null?null:v-b}ctx.strokeStyle=mode==='topology'||mode==='voltage'?(colors[l.voltage_kv]||'#777'):valueColor(v,mode);ctx.globalAlpha=mode==='voltage'?.3:.8;ctx.lineWidth=selected===l?4:(mode==='loading'&&v>100?2.2:1);ctx.beginPath();l.coordinates.forEach(([x,y],i)=>{const p=point(x,y);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke()}
ctx.globalAlpha=1;for(const b of topo.buses){if(!visible.has(+b.voltage_kv))continue;if(mode!=='voltage'&&selected!==b)continue;const p=point(b.lon,b.lat);ctx.fillStyle=selected===b?'#fff':valueColor(current?.bus_voltage[b.bus_id],'voltage');ctx.beginPath();ctx.arc(...p,selected===b?6:2.5,0,Math.PI*2);ctx.fill()}
$('legend').textContent=mode==='topology'?'60 蓝 · 130 紫 · 150 绿 · 220 黄 · 400 红 kV':mode==='loading'?'蓝 ≤80% · 黄 80–100% · 红 >100%':mode==='voltage'?'红 <0.95 · 绿 0.95–1.05 · 紫 >1.05 p.u.（显示色阶）':'蓝 下降 · 灰 |差值|≤0.05 · 红 上升（百分点）';}
function details(obj){selected=obj;$('detail').replaceChildren();if(!obj){draw();return}const title=document.createElement('strong');title.textContent=obj.facility_name||obj.name||obj.bus_id||obj.line_id;$('detail').append(title);const dl=document.createElement('dl');const vals=obj.bus_id?{bus_id:obj.bus_id,voltage_kv:obj.voltage_kv,vm_pu:current?.bus_voltage[obj.bus_id],source:obj.source,source_status:obj.source_status}:{line_id:obj.line_id,from_bus:obj.from_bus,to_bus:obj.to_bus,voltage_kv:obj.voltage_kv,loading_percent:current?.line_loading[obj.line_id],baseline_loading_percent:baseline?.line_loading[obj.line_id],difference_pp:current?.line_loading[obj.line_id]==null||baseline?.line_loading[obj.line_id]==null?null:current.line_loading[obj.line_id]-baseline.line_loading[obj.line_id],source:obj.source,source_status:obj.source_status,parameter_status:obj.parameter_status};for(const [k,v]of Object.entries(vals)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v??'无计算值';dl.append(dt,dd)}$('detail').append(dl);draw()}
async function load(){const token=++request,caseId=$('case').value,variant=$('variant').value;current=null;baseline=null;draw();$('status').textContent='正在读取设备结果…';$('download').removeAttribute('href');try{const [r,b]=await Promise.all([get(`/api/results?case=${encodeURIComponent(caseId)}&variant=${variant}`),variant==='AC_REVISED'?Promise.resolve(null):get(`/api/results?case=${encodeURIComponent(caseId)}&variant=AC_REVISED`)]);if(token!==request)return;current=r;baseline=b||r;const row=group.find(c=>c.case_id===caseId);$('slider').value=group.indexOf(row);$('time').textContent=row.timestamp_utc;const lv=Object.values(r.line_loading).filter(v=>v!==null),bv=Object.values(r.bus_voltage).filter(v=>v!==null);$('stats').replaceChildren();for(const txt of [`母线电压 ${Math.min(...bv).toFixed(4)}–${Math.max(...bv).toFixed(4)} p.u.`,`最大线路负载 ${Math.max(...lv).toFixed(2)}%`,`超过 100% 的线路 ${lv.filter(v=>v>100).length}`,`有结果的母线 / 线路 ${bv.length} / ${lv.length}`]){const d=document.createElement('div');d.textContent=txt;$('stats').append(d)}$('status').textContent=`已载入 ${caseId}`;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([JSON.stringify(r)],{type:'application/json'}));$('download').href=blobUrl;details(selected)}catch(e){if(token===request){$('status').textContent=`加载失败：${e.message}`;$('stats').textContent='该案例未显示结果';draw()}}}
function season(){const custom=$('season').value==='CUSTOM';$('variant').disabled=custom;if(custom)$('variant').value='AC_REVISED';$('mode').querySelector('option[value=delta]').disabled=custom;if(custom&&$('mode').value==='delta')$('mode').value='loading';group=catalog.cases.filter(c=>c.season===$('season').value);$('case').replaceChildren();for(const row of group){const o=document.createElement('option');o.value=row.case_id;o.textContent=row.timestamp_utc.replace('T',' ').replace('+00:00',' UTC');$('case').append(o)}$('slider').max=group.length-1;load()}
$('season').onchange=season;$('case').onchange=load;$('variant').onchange=load;$('mode').onchange=draw;$('slider').onchange=()=>{$('case').selectedIndex=+$('slider').value;load()};
for(const [id,delta]of [['prev',-1],['next',1]])$(id).onclick=()=>{$('case').selectedIndex=Math.max(0,Math.min(group.length-1,$('case').selectedIndex+delta));load()};
$('reset').onclick=fit;$('find').onclick=()=>{const q=$('search').value.trim().toLowerCase();if(!q)return;const items=[...topo.buses,...topo.lines];const matches=o=>[o.bus_id,o.line_id,o.facility_name,o.name].filter(Boolean);const obj=items.find(o=>matches(o).some(v=>v.toLowerCase()===q))||items.find(o=>matches(o).some(v=>v.toLowerCase().includes(q)));if(!obj){$('status').textContent='未找到匹配设备';return}visible.add(+obj.voltage_kv);for(const c of $('volts').querySelectorAll('input'))c.checked=visible.has(+c.parentElement.textContent);const xy=obj.bus_id?[+obj.lon,+obj.lat]:obj.coordinates[Math.floor(obj.coordinates.length/2)];scale=Math.max(scale,1500);ox=W/2-xy[0]*.77*scale;oy=H/2+xy[1]*scale;details(obj)};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};
canvas.onwheel=e=>{e.preventDefault();const box=canvas.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top,f=e.deltaY<0?1.2:1/1.2;scale*=f;ox=x+(ox-x)*f;oy=y+(oy-y)*f;draw()};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];moved=false;canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;ox+=dx;oy+=dy;drag=[e.clientX,e.clientY];draw()};
canvas.onpointerup=e=>{drag=null;if(moved||!topo)return;const box=canvas.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top;let best=8,obj=null;for(const b of topo.buses){if(!visible.has(+b.voltage_kv))continue;const p=point(b.lon,b.lat),d=Math.hypot(p[0]-x,p[1]-y);if(d<best){best=d;obj=b}}if(!obj)for(const l of topo.lines){if(!visible.has(+l.voltage_kv))continue;for(let i=1;i<l.coordinates.length;i++){const a=point(...l.coordinates[i-1]),b=point(...l.coordinates[i]);const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));const d=Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);if(d<best){best=d;obj=l}}}details(obj)};
window.onresize=resize;
(async()=>{try{[catalog,topo]=await Promise.all([get('/api/catalog'),get('/api/topology')]);$('version').textContent=catalog.version;if(catalog.cases.some(c=>c.season==='CUSTOM')){const o=document.createElement('option');o.value='CUSTOM';o.textContent='本地求解案例';$('season').append(o);$('season').value='CUSTOM'}resize();season()}catch(e){$('status').textContent=`加载失败：${e.message}`}})();
</script></body></html>
